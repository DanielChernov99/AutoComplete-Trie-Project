<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoComplete Trie</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page-content-container">
        <div class="add-row">
            <input id="addInput" type="text" placeholder="Enter a word to enter to the dictionary">
            <button id="addButton" type="button">Add Word</button>
        </div>
        <!-- will have two classes one for error and one for succsess -->
        <div class="add-result-row">
            <p id="addResultText"></p>
        </div>
        <div class="search-row">
            <input id="searchInput" type="text" placeholder="Start typing to see suggestions">
        </div>
        <ul id="suggestionsList"></ul>
        <div class="count-row">
            <p id="countNumber">0</p>
            <p>Words in Dictionary</p>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
